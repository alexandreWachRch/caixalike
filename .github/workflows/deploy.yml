name: Deploy CaixaLike → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # Permite acionamento manual pela interface do GitHub

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group:              "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🧪 Validar arquivos essenciais
        run: |
          for f in index.html css/style.css js/pagamentos.js js/qrcode.min.js \
                   servicos/index.html planos/index.html contato/index.html; do
            test -f "$f" || { echo "::error::Arquivo ausente: $f"; exit 1; }
          done

      - name: 📦 Montar pasta do site (apenas arquivos públicos)
        run: |
          mkdir _site
          cp -r index.html css js img servicos planos contato \
                robots.txt sitemap.xml CNAME _site/

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: 🚀 Deploy para GitHub Pages
        id:   deployment
        uses: actions/deploy-pages@v4
